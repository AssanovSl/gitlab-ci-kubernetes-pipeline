apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - configmap.yml
  - secrets.yml

patchesStrategicMerge:
  - delete-pv.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: postgres-storage
          emptyDir: {}

images:
  - name: dorothag/gateway-service
    newTag: latest

  - name: dorothag/payment-service
    newTag: latest

  - name: dorothag/booking-service
    newTag: latest

  - name: dorothag/hotel-service
    newTag: latest

  - name: dorothag/session-service
    newTag: latest

  - name: dorothag/report-service
    newTag: latest

  - name: dorothag/loyalty-service
    newTag: latest
